[project]
name = "aiops-gemini-cli-demo"
version = "1.0.0"
description = "Production-grade AIOps demo using Gemini CLI and MCP servers"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "markdown-pdf>=1.13.1",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "google-adk>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.uv]
index-url = "https://pypi.org/simple/"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
